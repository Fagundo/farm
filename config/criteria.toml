portal_property_types = [
  "farm with barn and acreage", "acreage with large shop", "riverfront or creekfront acreage",
  "horse property with arena", "wedding venue or event barn", "house on 10+ acres",
  "farm with guest house", "orchard or vineyard with house", "lodge or cabin compound",
  "secluded acreage with creek or river", "spa or retreat property on acreage",
  "vineyard with house", "hobby farm with barn and house", "farmhouse with outbuildings on acreage",
  "bed and breakfast on acreage", "farm with guest cabins",
]
