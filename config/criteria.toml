[rentcast]
# Licensed MLS listings API (RENTCAST_API_KEY). Each area is a whole state or a circle of up to
# 100 miles; one request returns up to 500 listings.
max_pages_per_state = 4
[[rentcast.areas]]
state = "WA"
[[rentcast.areas]]
state = "OR"
[[rentcast.areas]]
name = "North Idaho"
lat = 47.4
lon = -116.6
radius = 100
[[rentcast.areas]]
name = "Boise and McCall"
lat = 44.2
lon = -116.2
radius = 100
[[rentcast.areas]]
