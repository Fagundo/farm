# farmscout criteria — the single place to tune what counts as a good property.
# Target: agriculture plus a small hospitality business (event venue, restaurant / farm-to-table,
# or spa with sauna) in a quiet, secluded setting. Pacific Northwest, <= $1M.
# Area: WA and OR, most of Idaho, western Montana and far northern California,
# scored to favor places close to Seattle.

[hard_filters]
max_price_usd = 1_000_000
min_acres = 5
max_acres = 160
allowed_states = ["WA", "OR", "ID", "MT", "CA"]
# Farther than this from home (Seattle) is out of range.
max_drive_minutes_to_home = 690
# Listings with an unknown price/acreage/county are kept but flagged "verify".
keep_unknowns = true

# Vacant land. Off: only properties with existing buildings (farms, venues, vineyards, lodges)
# are kept. If switched on, land must be zoned for the use and priced to leave room to build.
[land]
include = false
max_price_usd = 650_000

# Acreage inside this range scores full points; 80-160 acres score partial points.
[acreage]
ideal_min = 5
ideal_max = 80

# Where "close" is measured from. The home_proximity rule scores drive time to here.
[home]
name = "Seattle"
lat = 47.6062
lon = -122.3321

# Cities guests and customers come from (reachable, not right next door); metro_proximity scores the nearest one.
[[metros]]
name = "Seattle"
lat = 47.6062
lon = -122.3321
[[metros]]
name = "Portland"
lat = 45.5152
lon = -122.6784
[[metros]]
name = "Spokane"
lat = 47.6588
lon = -117.4260
[[metros]]
name = "Boise"
lat = 43.6150
lon = -116.2023
[[metros]]
name = "Missoula"
lat = 46.8721
lon = -113.9940
[[metros]]
name = "Sacramento"
lat = 38.5816
lon = -121.4944

# Counties in range, with coordinates for drive-time estimates. A county must be listed to be in range.
[geo]
counties_file = "config/counties.csv"
road_factor = 1.2   # road miles per straight-line mile
mph = 60

# Zoning classes, checked in this order; first regex match wins (case-insensitive).
# "commercial" = restaurant/venue plausible; "mixed" = conditional uses likely;
# "farm_only"/"forest_only" = farming yes, venue/restaurant hard.
[[zoning.classes]]
name = "commercial"
patterns = [
  'rural commercial', 'tourist commercial', 'rural business', 'rural activity center',
  'lamird', 'rural village', 'resort', 'recreation(al)? commercial',
  '\bRC\b', '\bCR\b', '\bC-\d', '\bRB\b', '\bNC\b', 'commercial(?! ag)',
]
[[zoning.classes]]
name = "farm_only"
patterns = [
  'exclusive farm use', '\bEFU\b', '\bEF-?\d+', 'agricultural production district', '\bAPD\b',
  'commercial ag', 'ag-?nrl', 'rural resource', '-NRL\b', '\bFF\b', 'agricultural resource', '\bA-?10\b', '\bA-?20\b',
]
[[zoning.classes]]
name = "forest_only"
patterns = ['\bF-?\d+', 'commercial forest', 'timber', 'forest resource']
[[zoning.classes]]
name = "mixed"
patterns = [
  '\bAF-?\d+', 'farm/forest', 'rural residential', '\bRR-?\d*', '\bRA-?\d+', '\bR-?5\b',
  '\bR-?10\b', 'rural agricultur', 'rural \d+', 'agricultural/residential', '\bAR-?\d*',
  'agri-?business', '\bAB\b', '\bRDD\b',
]

# Businesses the property could host. business_pathway scores whichever fits best, so equal
# weights mean "any one of these is enough"; raise a weight to favor that business.
# existing_uses: operating uses that show it's permitted; zoning_patterns: zones that allow it
# beyond plain "commercial"; resource_zone_credit: partial credit on farm/forest-only land.
[[business_uses]]
key = "venue"
label = "Event venue"
weight = 1
existing_uses = ["event venue", "wedding venue", "retreat center", "guest ranch", "campground",
                 "glamping", "winery", "lodge"]
zoning_patterns = ['resort', 'recreation', 'tourist']
resource_zone_credit = 0.25   # some counties allow a capped number of agritourism events
[[business_uses]]
key = "food"
label = "Restaurant / farm-to-table"
weight = 1
existing_uses = ["restaurant", "cafe", "winery", "tasting room", "cidery", "brewery", "distillery",
                 "farm stand", "bed and breakfast", "inn", "lodge"]
zoning_patterns = ['tourist', 'rural village', 'resort']
[[business_uses]]
key = "wellness"
label = "Spa / sauna"
weight = 1
existing_uses = ["spa", "bathhouse", "hot springs", "retreat center", "lodge", "inn",
                 "bed and breakfast", "glamping", "guest ranch"]
zoning_patterns = ['resort', 'recreation', 'tourist']

# Soft rules: points toward the fit score. The total is scaled to 0-100, so weights are relative.
[weights]
business_pathway = 30
seclusion = 10         # secluded beats highway frontage (relaxation)
home_proximity = 20
existing_approved_use = 15
water_supply = 10
plunge_water = 10
metro_proximity = 5
convertible_buildings = 10
commercial_kitchen = 5
extra_dwelling = 5
access = 5
acreage_fit = 5
build_readiness = 10   # vacant land only: power, water, septic, access

# Red flags subtract points.
[penalties]
floodplain = 10
hoa = 10
shared_private_road = 5
farm_only_no_existing_use = 15

[scoring]
# Score at or above this is a "shortlist" candidate in reports.
shortlist_threshold = 55

[search]
# Each run picks a random sample of (property type x place) combinations, so successive weekly
# runs cover the grid. Each query is one Claude call with up to web_search_max_uses searches.
max_queries = 150
max_portal_queries = 90
results_per_query = 20
property_types = [
  "winery with acreage for sale",
  "event venue with acreage for sale",
  "wedding venue farm for sale",
  "farm with event barn for sale",
  "retreat center for sale",
  "farm with commercial kitchen for sale",
  "bed and breakfast on acreage for sale",
