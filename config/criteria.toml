  "lodge on acreage for sale",
  "glamping or campground property for sale",
  "hot springs property for sale",
  "orchard with farm stand for sale",
  "lavender or flower farm for sale",
  "u-pick farm for sale",
  "farm stay or agritourism property for sale",
  "former restaurant on acreage for sale",
  # Spa / sauna / wellness and food businesses, favoring quiet settings
  "spa or wellness retreat on acreage for sale",
  "bathhouse or day spa property for sale",
  "secluded retreat property with creek or river for sale",
  "cafe or restaurant on rural acreage for sale",
  "inn or guest lodge on acreage for sale",
  "secluded farm or homestead bordering national forest for sale",
  # Working farms, vineyards and homesteads with buildings to convert
  "vineyard with house for sale",
  "hobby farm with barn and house for sale",
  "farmhouse with outbuildings on acreage for sale",
  "horse property with barn and arena for sale",
