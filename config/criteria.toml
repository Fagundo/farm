# farmscout criteria — the single place to tune what counts as a good property.
# Target: agriculture + sauna + event space / farm-to-table, Pacific Northwest, <= $1M.
# Area: all of WA and OR, plus the Boise area and north Idaho.

[hard_filters]
max_price_usd = 1_000_000
min_acres = 2
max_acres = 160
allowed_states = ["WA", "OR", "ID"]
# Listings with an unknown price/acreage/county are kept but flagged "verify".
keep_unknowns = true

# Acreage inside this range scores full points; 2-5 and 80-160 acres score partial points.
[acreage]
ideal_min = 5
ideal_max = 80

